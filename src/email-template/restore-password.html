<!doctype html>
<html lang="{{lang}}" xmlns:v="urn:schemas-microsoft-com:vml">
  <head>
    <meta charset="utf-8" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no, url=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings
            xmlns:o="urn:schemas-microsoft-com:office:office"
          >
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
      <style>
        td,
        th,
        div,
        p,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
          font-family: 'Segoe UI', sans-serif;
          mso-line-height-rule: exactly;
        }
      </style>
    <![endif]-->
    <title>{{title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
      media="screen"
    />
  </head>
  <body
    style="
      background-color: #d9dffa;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      margin: 0;
      width: 100%;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      word-break: break-word;
    "
  >
    <div
      role="article"
      aria-roledescription="email"
      aria-label="{{title}}"
      lang="{{lang}}"
    >
      <div style="padding-top: 80px">
        <div style="margin-left: auto; margin-right: auto; max-width: 60%">
          <div
            style="
              border-radius: 12px;
              background-color: #fffffe;
              padding: 1px 32px 60px;
            "
          >
            <div style="margin-top: -40px">
              <img
                src="cid:icon-lock.png"
                alt="Lock"
                decoding="async"
                style="max-width: 100%; vertical-align: middle"
              />
            </div>

            <h1
              style="
                margin-top: 0;
                margin-bottom: 0;
                font-size: 38px;
                font-weight: 700;
                color: #506bec;
              "
            >
              {{heading}}
            </h1>
            <div
              style="
                font-size: 16px;
                color: #40507a;
                margin-top: 20px;
                margin-bottom: 0px;
              "
            >
              <p style="margin-top: 0; margin-bottom: 0">{{txt1}}</p>
              <p style="margin-top: 20px; margin-bottom: 0px">{{txt2}}</p>
            </div>
            <div
              style="
                padding-top: 12px;
                padding-bottom: 12px;
                margin-top: 20px;
                margin-bottom: 0px;
              "
            >
              <a
                href="https://{{domain}}/reset-password?code={{code}}"
                style="
                  display: inline-block;
                  text-decoration: none;
                  padding: 16px 25px;
                  font-size: 16px;
                  line-height: 1;
                  background-color: #f17a6b;
                  color: #fff;
                  border-radius: 16px;
                  text-align: center;
                  font-weight: 700;
                  text-transform: uppercase;
                "
              >
                <!--[if mso
                  ]><i style="mso-font-width: 150%; mso-text-raise: 31px" hidden
                    >&emsp;</i
                  ><!
                [endif]-->
                <span style="mso-text-raise: 16px">{{buttonLabel}}</span>
                <!--[if mso
                  ]><i hidden style="mso-font-width: 150%">&emsp;&#8203;</i><!
                [endif]-->
              </a>
            </div>
            <div style="font-size: 14px; margin-top: 20px; margin-bottom: 0px">
              <span style="color: #97a2d2">{{expiration}}</span>
            </div>
            <div
              style="
                font-size: 14px;
                color: #40507a;
                margin-top: 20px;
                margin-bottom: 0px;
              "
            >
              {{trouble}}
              <a
                href="mailto:support@perilines.com.ua"
                style="font-weight: 700; color: #40507a; text-decoration: none"
                >support@perilines.com.ua</a
              >
            </div>
            <div
              style="
                font-size: 14px;
                color: #42688a;
                margin-top: 20px;
                margin-bottom: 0px;
              "
            >
              {{ignore}}
            </div>
          </div>
        </div>
      </div>
      <div
        style="
          margin-left: auto;
          margin-right: auto;
          max-width: 60%;
          padding-top: 40px;
          text-align: center;
        "
      >
        <div
          style="
            margin-left: auto;
            margin-right: auto;
            display: inline-block;
            max-width: 150px;
          "
        >
          <img
            src="cid:logo.png"
            alt="Logo"
            decoding="async"
            style="max-width: 100%; width: 100%; vertical-align: middle"
          />
        </div>
        <div style="font-size: 14px; margin-top: 16px; margin-bottom: 0px">
          <span style="color: #40507a">{{address}}</span>
          <span style="color: #40507a">|</span>
          <a
            target="_blank"
            href="https://{{domain}}"
            style="color: #3b82f6; text-decoration: none"
            >{{domain}}</a
          >
        </div>
        <div
          style="
            font-size: 12px;
            color: #94a3b8;
            margin-top: 16px;
            margin-bottom: 0px;
          "
        >
          <span>{{donotReply}}</span>
        </div>
      </div>
    </div>
  </body>
</html>
